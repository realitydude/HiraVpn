name: Hira VPN APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OpenVPN sources
        run: |
          git clone https://github.com/schwabe/ics-openvpn.git engine
          git -C engine checkout 14c315f5a1d526fcd0b36323e724d4e199c6d137
          git -C engine submodule update --init --recursive
          python3 apply.py engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y swig cmake ninja-build
          sdkmanager "platforms;android-36" "ndk;29.0.14206865"
      - name: Build installable test APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew :main:assembleUiOvpn2Debug --stacktrace --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - uses: actions/upload-artifact@v4
        with:
          name: HiraVPN-Test-APK
          path: engine/main/build/outputs/apk/**/*.apk
          if-no-files-found: error
